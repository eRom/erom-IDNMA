# Gabarits partagés : un bloc nommé par une ancre (&nom) se reprend par alias (*nom) ;
# dans un env, la clé de fusion `<<` l'injecte et les clés écrites à côté l'emportent.
# Seule la section agents: est lue : presets: ne fait que porter les ancres, et doit la précéder.
# Attention, la fusion est superficielle : garder les gabarits au niveau d'env, jamais d'un engine
# entier, sinon l'env propre de l'agent remplacerait celui du gabarit en bloc.
# Engine claude dont l'env fixe ANTHROPIC_BASE_URL : ANTHROPIC_MODEL et les ANTHROPIC_DEFAULT_*_MODEL
# absents reçoivent model: au lancement ; n'écrire que les paliers qui doivent viser un autre modèle.
# Gabarits partagés, repris plus bas par alias (*nom) et clé de fusion (<<).
# idnma et IdemA ne lisent que la section agents: ; celle-ci doit précéder les alias.
presets:
  openrouter: &openrouter
    ANTHROPIC_BASE_URL: "https://openrouter.ai/api"
    ANTHROPIC_AUTH_TOKEN: "$OPENROUTER_API_KEY"
    ANTHROPIC_API_KEY: ""
  ollama: &ollama
    ANTHROPIC_BASE_URL: "http://localhost:11434"
    ANTHROPIC_AUTH_TOKEN: "ollama"
    ANTHROPIC_API_KEY: ""
  lmstudio: &lmstudio
    ANTHROPIC_BASE_URL: "http://localhost:1234"
    ANTHROPIC_AUTH_TOKEN: "lmstudio"
    ANTHROPIC_API_KEY: ""
  claude-max: &claude-max [--effort, max, --dangerously-skip-permissions]

agents:
  opus:
    label: Opus
    avatar: claude
    engines:
      default:
        harness: claude
        model: opus
        options: [--effort, medium, --dangerously-skip-permissions, --remote-control]
  sonnet:
    label: Sonnet
    avatar: claude
    engines:
      default:
        harness: claude
        model: sonnet
        options: [--effort, high, --dangerously-skip-permissions, --remote-control]
  argon:
    label: Argon
    avatar: gemini
    engines:
      default:
        harness: agy
        model: gemini-4-argon
        options: [--effort, medium, --dangerously-skip-permissions, --remote-control]
      claude:
        harness: claude
        model: google/gemini-4-argon[1m]
        options: [--effort, medium, --dangerously-skip-permissions]
        env:
          <<: *openrouter
  gemini:
    label: Gemini 3.8 Flash
    avatar: gemini
    engines:
      default:
        harness: agy
        model: gemini-3.8-flash
        options: [--effort, high, --dangerously-skip-permissions, --remote-control]
  luna:
    label: Luna
    avatar: codex
    engines:
      default:
        harness: codex
        model: gpt-6-luna
        options: [--dangerously-bypass-approvals-and-sandbox]
  