# Gabarits partagés : un bloc nommé par une ancre (&nom) se reprend par alias (*nom) ;
# dans un env, la clé de fusion `<<` l'injecte et les clés écrites à côté l'emportent.
# Seule la section agents: est lue : presets: ne fait que porter les ancres, et doit la précéder.
# Attention, la fusion est superficielle : garder les gabarits au niveau d'env, jamais d'un engine
# entier, sinon l'env propre de l'agent remplacerait celui du gabarit en bloc.
presets:
  ollama: &ollama
    ANTHROPIC_BASE_URL: "http://localhost:11434"
    ANTHROPIC_AUTH_TOKEN: "ollama"
    ANTHROPIC_API_KEY: ""
  openrouter: &openrouter
    ANTHROPIC_BASE_URL: "https://openrouter.ai/api"
    ANTHROPIC_AUTH_TOKEN: "$OPENROUTER_API_KEY" # résolu depuis l'environnement
    ANTHROPIC_API_KEY: ""
  claude-max: &claude-max
    - --effort
    - max
    - --dangerously-skip-permissions

agents:
  claude:
    label: Claude Agent
    info: Claude 5.x
    cell: 1
    engines:
      default:
        harness: claude
        model: opus
        options:
          - --effort
          - medium
          - --dangerously-skip-permissions
          - --remote-control
  glm:
    label: GLM Agent
    info: GLM 5.3
    cell: 2
    engines:
      default:
        harness: claude
        model: &glm-flash glm-5.3-flash:cloud[1m]
        options: *claude-max
        env:
          <<: *ollama
          ANTHROPIC_MODEL: *glm-flash
          ANTHROPIC_DEFAULT_FABLE_MODEL: &glm glm-5.3:cloud[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: *glm
          ANTHROPIC_DEFAULT_SONNET_MODEL: *glm-flash
          ANTHROPIC_DEFAULT_HAIKU_MODEL: *glm-flash
          CLAUDE_CODE_EFFORT_LEVEL: "max"
  deepseek:
    label: Deepseek Agent
    info: Deepseek v4
    cell: 3
    engines:
      default:
        harness: claude
        model: &deepseek-flash deepseek-v4.1-flash:cloud[1m]
        options: *claude-max
        env:
          <<: *ollama
          ANTHROPIC_MODEL: *deepseek-flash
          ANTHROPIC_DEFAULT_FABLE_MODEL: "deepseek-v4-pro:cloud[1m]"
          ANTHROPIC_DEFAULT_OPUS_MODEL: *deepseek-flash
          ANTHROPIC_DEFAULT_SONNET_MODEL: *deepseek-flash
          ANTHROPIC_DEFAULT_HAIKU_MODEL: *deepseek-flash
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "786432"
  qwen:
    label: QWEN Agent
    info: Qwen 3.8
    cell: 4
    engines:
      default:
        harness: claude
        model: &qwen-flash qwen/qwen3.8-flash[1m]
        options: *claude-max
        env:
          <<: *openrouter
          ANTHROPIC_MODEL: *qwen-flash
          ANTHROPIC_DEFAULT_HAIKU_MODEL: *qwen-flash
          ANTHROPIC_DEFAULT_SONNET_MODEL: *qwen-flash
          ANTHROPIC_DEFAULT_OPUS_MODEL: &qwen-max qwen/qwen3.8-max-0902[1m]
          ANTHROPIC_DEFAULT_FABLE_MODEL: *qwen-max
  kimi:
    label: Kimi Agent
    info: K3
    cell: 5
    engines:
      default:
        harness: claude
        model: &kimi kimi-k3:cloud[1m]
        options: *claude-max
        env:
          <<: *ollama
          ANTHROPIC_MODEL: *kimi
          ANTHROPIC_DEFAULT_HAIKU_MODEL: *kimi
          ANTHROPIC_DEFAULT_SONNET_MODEL: *kimi
          ANTHROPIC_DEFAULT_OPUS_MODEL: *kimi
          ANTHROPIC_DEFAULT_FABLE_MODEL: *kimi
  muse:
    label: Muse Spark Agent
    info: Spark 1.3
    cell: 6
    engines:
      default:
        harness: claude
        model: &muse meta/muse-spark-1.3[1m]
        options: *claude-max
        env:
          <<: *openrouter
          ANTHROPIC_MODEL: *muse
          ANTHROPIC_DEFAULT_HAIKU_MODEL: *muse
          ANTHROPIC_DEFAULT_SONNET_MODEL: *muse
          ANTHROPIC_DEFAULT_OPUS_MODEL: *muse
          ANTHROPIC_DEFAULT_FABLE_MODEL: *muse
  grok:
    label: Grok Agent
    info: 4.7
    cell: 0
    engines:
      default:
        harness: grok
        model: grok-4.7
        options:
          - --effort
          - high
          - --always-approve
  agy:
    label: AGY Agent
    info: 3.8
    cell: 0
    avatar: gemini.png
    engines:
      default:
        harness: agy
        model: gemini-4-argon-medium
  codex:
    label: Codex Agent
    info: GPT 6
    cell: 0
    engines:
      default:
        harness: codex
        options:
          - --dangerously-bypass-approvals-and-sandbox
  opencode:
    label: Opencode Agent
    info: 2.2
    cell: 0
    engines:
      default:
        harness: opencode
        model: opencode/big-pickle
      deepseek:
        harness: opencode
        model: ollama-cloud/deepseek-v4.1-flash
        options:
          - --auto
  dst:
    label: Dst Agent
    info: DeepSeek Harness TUI
    cell: 0
    # dst ne prend pas de model: le modèle se choisit avec /model dans dst, qui le retient.
    engines:
      default:
        harness: dst
      full:
        harness: dst
        env:
          DSH_PERMISSION_MODE: danger-full-access
