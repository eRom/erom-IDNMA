name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install tmux
        run: brew install tmux
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # Le vrai installeur, joué sur le commit testé : clone, dépendances figées, bun link, config.
  installer:
    name: Installer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            label: macOS 26
          - os: ubuntu-latest
            label: Linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install tmux and shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux shellcheck
      - name: Install tmux and shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - name: Lint the installer
        run: shellcheck scripts/install.sh
      # Un tag local rend le commit testé clonable par son nom, même quand c'est le commit de fusion d'une PR.
      - name: Tag the commit under test
        run: git tag ci-under-test
      - name: Run the installer
        env:
          IDNMA_REPO: ${{ github.workspace }}
          IDNMA_VERSION: ci-under-test
          IDNMA_HOME: ${{ runner.temp }}/idnma
        run: /bin/bash scripts/install.sh
      - name: idnma --version matches package.json
        run: |
          expected="idnma $(jq -r .version package.json)"
          actual="$(idnma --version)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"
      - name: Re-running the installer updates in place
        env:
          IDNMA_REPO: ${{ github.workspace }}
          IDNMA_VERSION: ci-under-test
          IDNMA_HOME: ${{ runner.temp }}/idnma
        run: /bin/bash scripts/install.sh

  # Linux supporté pour Claude et Codex depuis la recette du 03/11/2026 : ce job bloque la CI.
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
